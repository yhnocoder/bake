name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the release tag names the version in package.json
        run: test "${{ github.event.release.tag_name }}" = "v$(node -p "require('./package.json').version")"
      # The secret NPM_TOKEN is an npm access token that may publish @yhnocoder/bake.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
