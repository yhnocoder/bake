name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: make check

  screenshots:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Take and compare screenshots
        run: |
          folder="pr/$PR_NUMBER/${HEAD_SHA:0:7}"
          export SCREENSHOT_URL_PREFIX="https://github.com/$GITHUB_REPOSITORY/blob/ci-screenshots/$folder/"
          export SCREENSHOT_URL_SUFFIX="?raw=true"
          scripts/screenshots.sh HEAD^1
      - name: Publish screenshots to the ci-screenshots branch
        run: scripts/publish-screenshots.sh test-out/screenshots/report "$PR_NUMBER" "${HEAD_SHA:0:7}"
      - name: Update the screenshots section of the pull request description
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const section = [
              '<!-- screenshots:start -->',
              '## Screenshots',
              '',
              `Every page of \`examples/blog/\` at 1440 and 375 pixels wide, light and dark, for commit ${process.env.HEAD_SHA.slice(0, 7)} compared with its base branch. [Run](${run})`,
              '',
              fs.readFileSync('test-out/screenshots/report/summary.md', 'utf8').trim(),
              '<!-- screenshots:end -->',
            ].join('\n');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const body = pr.body ?? '';
            const marked = /<!-- screenshots:start -->[\s\S]*<!-- screenshots:end -->/;
            const next = marked.test(body) ? body.replace(marked, () => section) : `${body}\n\n${section}`;
            await github.rest.pulls.update({ ...context.repo, pull_number: context.issue.number, body: next });
