name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint.sh

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node --test --test-shard=${{ matrix.shard }}/2 "test/*.test.js"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node --test --test-timeout=120000 --test-shard=${{ matrix.shard }}/3 "test/browser/*.test.js"

  test:
    needs: [lint, unit, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULTS" = "success success success"
        env:
          RESULTS: ${{ needs.lint.result }} ${{ needs.unit.result }} ${{ needs.browser.result }}
