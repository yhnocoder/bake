name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  performance:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the example blog
        working-directory: examples/blog
        run: node ../../src/cli.js build
      - name: Measure the published pages
        run: |
          mkdir -p test-out/perf
          node scripts/measure-pages.js examples/blog/dist --out test-out/perf/report.json
      - name: Check the performance budgets
        run: node scripts/check-budgets.js test-out/perf/report.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: performance-report
          path: test-out/perf/report.json
          if-no-files-found: warn
          retention-days: 30

  dev:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Measure bake dev
        run: |
          mkdir -p test-out/perf
          node scripts/measure-dev.js --out test-out/perf/dev.json
      - name: Check the performance budgets
        run: node scripts/check-budgets.js test-out/perf/dev.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dev-report
          path: test-out/perf/dev.json
          if-no-files-found: warn
          retention-days: 30

  repeat:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # why: a test that depends on timing fails more often when every test runs three times on twice as many workers as processors
      - name: Run the browser tests three times under load
        run: npx playwright test --repeat-each=3 --workers=200%
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: repeat-browser-traces
          path: test-out/playwright
          retention-days: 7

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run the unit tests
        run: npm test
      - name: Run the browser tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: macos-browser-traces
          path: test-out/playwright
          retention-days: 7

  # why: a failed scheduled run is otherwise seen by nobody, while the person who starts a run by hand watches it
  report:
    needs: [performance, dev, repeat, macos]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue, or comment on the open one, for the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='The nightly tests failed'
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The nightly run $RUN failed."
          else
            gh issue create --title "$title" --body "The nightly run $RUN failed. Its jobs show which budgets were exceeded or which tests failed, and the artifacts hold the reports and the traces."
          fi
