name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the example blog
        working-directory: examples/blog
        run: node ../../src/cli.js build
      - name: Measure the published pages
        run: |
          mkdir -p test-out/perf
          node scripts/measure-pages.js examples/blog/dist --out test-out/perf/report.json
      - name: Check the performance budgets
        run: node scripts/check-budgets.js test-out/perf/report.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: performance-report
          path: test-out/perf/report.json
          if-no-files-found: warn
          retention-days: 30

  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BAKE_FRAMES: all
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:frames
