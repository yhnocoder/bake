name: Set up Bake
description: Installs Node 24, the npm dependencies and, unless the job's container provides it, Playwright's Chromium headless shell with its system libraries.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - run: npm ci
      shell: bash
    # why: a Linux job runs in the Playwright container, which holds Chromium and its system libraries, and sets PLAYWRIGHT_BROWSERS_PATH to them; an Ubuntu mirror sometimes takes minutes to download the libraries
    - id: playwright
      if: ${{ env.PLAYWRIGHT_BROWSERS_PATH == '' }}
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: ${{ env.PLAYWRIGHT_BROWSERS_PATH == '' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-headless-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: ${{ env.PLAYWRIGHT_BROWSERS_PATH == '' }}
      run: npx playwright install --with-deps --only-shell chromium
      shell: bash
